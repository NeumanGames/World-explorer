<style>
  :root {
    --bg: #0b1f3a;
    --panel: #112244;
    --panel2: #0e1c38;
    --border: #1e3a6e;
    --accent: #f5a623;
    --accent2: #4fc3f7;
    --green: #66bb6a;
    --red: #ef5350;
    --text: #e8f0fe;
    --muted: #8eacc8;
    --map-land: #2d6a4f;
    --map-land-hover: #40916c;
    --map-correct: #66bb6a;
    --map-wrong: #ef5350;
    --map-target: #f5a623;
    --map-learned: #4fc3f7;
    --map-search: #c77dff;
    --map-border: #1b2a3b;
    --map-water: #1565c0;
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ── Header ── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px;
    background: var(--panel);
    border-bottom: 2px solid var(--border);
    flex-shrink: 0;
    gap: 10px;
    flex-wrap: wrap;
  }
  #logo {
    font-family: 'Boogaloo', cursive;
    font-size: 1.5rem;
    color: var(--accent);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  #logo span { color: var(--accent2); }

  #score-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .score-chip {
    background: var(--panel2);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 0.82rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .score-chip .num { color: var(--accent); font-size: 1rem; }
  .score-chip .num.green { color: var(--green); }
  .score-chip .num.red   { color: var(--red); }
  #progress-wrap {
    width: 140px;
    background: var(--panel2);
    border-radius: 8px;
    height: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 8px;
    transition: width 0.4s ease;
    width: 0%;
  }
  #btn-menu {
    background: var(--panel2);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 20px;
    padding: 4px 14px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    transition: background 0.2s;
  }
  #btn-menu:hover { background: var(--border); }

  /* ── Layout ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #side {
    width: 224px;
    min-width: 180px;
    background: var(--panel);
    border-right: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
    padding: 8px 8px 16px 8px;
    gap: 7px;
  }
  .side-section {
    background: var(--panel2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 9px 10px;
  }
  .side-label {
    font-size: 0.68rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  /* Prompt */
  #prompt-mode {
    font-size: 0.68rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent2);
    margin-bottom: 3px;
  }
  #prompt-question {
    font-family: 'Boogaloo', cursive;
    font-size: 1.2rem;
    color: var(--text);
    line-height: 1.25;
    min-height: 2.4em;
    display: flex;
    align-items: center;
  }
  #prompt-question.correct { color: var(--green); }
  #prompt-question.wrong   { color: var(--red); }

  /* Capital clue */
  #capital-clue {
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 700;
    margin-top: 3px;
    min-height: 1.2em;
  }

  /* Feedback */
  #feedback-text {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
  }
  #feedback-text.correct { color: var(--green); }
  #feedback-text.wrong   { color: var(--red); }
  .srs-bar { display:flex; gap:2px; margin-top:5px; }
  .srs-pip {
    flex:1; height:5px; border-radius:3px;
    background: var(--border);
    transition: background 0.3s;
  }
  .srs-pip.filled { background: var(--accent); }

  /* Choices */
  #choices-box { display:flex; flex-direction:column; gap:5px; }
  .choice-btn {
    background: var(--panel2);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 9px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    text-align: left;
    transition: background 0.15s, border-color 0.15s;
  }
  .choice-btn:hover:not(:disabled) { background: var(--border); border-color: var(--accent2); }
  .choice-btn.correct { background: #1b4a1e; border-color: var(--green); color: var(--green); }
  .choice-btn.wrong   { background: #4a1b1b; border-color: var(--red);   color: var(--red); }
  .choice-btn:disabled { cursor: default; opacity: 0.85; }

  /* Mode buttons */
  .mode-btn {
    width: 100%;
    background: var(--panel2);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 9px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 0.79rem;
    font-weight: 700;
    margin-bottom: 4px;
    text-align: left;
    transition: background 0.15s, border-color 0.15s;
  }
  .mode-btn:last-child { margin-bottom: 0; }
  .mode-btn:hover:not(.active) { background: var(--border); }
  .mode-btn.active { border-color: var(--accent); color: var(--accent); background: #2a1f00; }

  /* Toggle switches */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 5px;
    font-size: 0.8rem;
    font-weight: 700;
  }
  .toggle-row:last-child { margin-bottom: 0; }
  .toggle {
    position: relative;
    width: 34px;
    height: 18px;
    flex-shrink: 0;
  }
  .toggle input { display: none; }
  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle input:checked + .toggle-track { background: var(--accent2); }
  .toggle-thumb {
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    background: white;
    border-radius: 50%;
    transition: left 0.2s;
    pointer-events: none;
  }
  .toggle input:checked ~ .toggle-thumb { left: 18px; }

  /* Search box */
  #search-input {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 5px 8px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    outline: none;
    margin-bottom: 5px;
  }
  #search-input:focus { border-color: var(--accent2); }
  #search-input::placeholder { color: var(--muted); }

  #search-list {
    max-height: 160px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #search-list::-webkit-scrollbar { width: 4px; }
  #search-list::-webkit-scrollbar-thumb { background: var(--border); border-radius:4px; }

  .search-item {
    background: var(--panel2);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 4px 7px;
    cursor: pointer;
    font-size: 0.76rem;
    font-weight: 700;
    transition: background 0.1s, border-color 0.1s;
  }
  .search-item:hover { background: var(--border); border-color: var(--accent2); }
  .search-item.selected { border-color: var(--map-search); color: var(--map-search); }
  .search-item .cap { font-weight: 400; color: var(--muted); font-size: 0.72rem; }
  .search-item.selected .cap { color: var(--map-search); opacity: 0.75; }

  /* Legend */
  .legend-item { display:flex; align-items:center; gap:6px; font-size:0.77rem; margin-bottom:3px; }
  .legend-dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }

  /* Zoom */
  #zoom-controls { display:flex; gap:5px; justify-content:center; }
  .zoom-btn {
    background: var(--panel2);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 0;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    transition: background 0.15s;
    flex: 1;
    text-align: center;
  }
  .zoom-btn:hover { background: var(--border); }

  /* ── Map ── */
  #map-area {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: var(--map-water);
    cursor: grab;
  }
  #map-area:active { cursor: grabbing; }
  #map-scroll {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
  }
  #map-svg { display: block; }

  .country {
    fill: var(--map-land);
    stroke: var(--map-border);
    stroke-width: 0.5px;
    cursor: pointer;
    transition: fill 0.12s;
  }
  .country:hover { fill: var(--map-land-hover); }
  .country.target  { fill: var(--map-target) !important; stroke: #fff; stroke-width: 1.2px; }
  .country.correct { fill: var(--map-correct) !important; }
  .country.wrong   { fill: var(--map-wrong) !important; }
  .country.learned { fill: var(--map-learned) !important; opacity: 0.7; }
  .country.dimmed  { fill: #162816 !important; opacity: 0.45; }
  .country.search-hi { fill: var(--map-search) !important; stroke: #fff; stroke-width: 1.2px; }

  .graticule-path { fill:none; stroke:rgba(255,255,255,0.06); stroke-width:0.5px; }
  .sphere-path    { fill: var(--map-water); }

  /* Tooltip */
  #tooltip {
    position: fixed;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 6px 12px;
    pointer-events: none;
    display: none;
    z-index: 100;
    white-space: nowrap;
    box-shadow: 0 3px 14px rgba(0,0,0,0.5);
    line-height: 1.4;
  }
  #tooltip .tt-country {
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--text);
  }
  #tooltip .tt-capital {
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--accent);
    margin-top: 1px;
  }

  /* ── Overlay ── */
  #overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  #overlay.show { display: flex; }
  .modal {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 26px 30px;
    max-width: 420px;
    width: 90vw;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .modal h2 { font-family:'Boogaloo',cursive; font-size:2rem; color:var(--accent); margin-bottom:10px; }
  .modal p  { color:var(--muted); font-size:0.88rem; margin-bottom:16px; line-height:1.5; }
  .modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .modal-btn {
    background: var(--panel2);
    border: 2px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 10px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 0.84rem;
    font-weight: 800;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    line-height: 1.3;
  }
  .modal-btn:hover { background: var(--border); border-color: var(--accent2); color: var(--accent2); }
  .modal-btn .icon { font-size:1.3rem; display:block; margin-bottom:3px; }
  .modal-stat { color:var(--accent2); font-size:1.6rem; font-family:'Boogaloo',cursive; }
  .modal-stat-label { font-size:0.78rem; color:var(--muted); margin-bottom:10px; }

  /* Responsive */
  @media (max-width:600px) { #side { width:170px; min-width:150px; } }
  @media (max-width:480px) { #side { display:none; } }
</style>

<body>

<div id="header">
  <div id="logo">World<span>Explorer</span> 🌍</div>
  <div id="score-bar">
    <div class="score-chip">✅ <span class="num green" id="sc-correct">0</span></div>
    <div class="score-chip">❌ <span class="num red"   id="sc-wrong">0</span></div>
    <div class="score-chip">🌍 <span class="num" id="sc-learned">0</span>/<span id="sc-total">177</span></div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <button id="btn-menu">☰ Menu</button>
  </div>
</div>

<div id="main">
  <div id="side">

    <!-- Prompt -->
    <div class="side-section">
      <div id="prompt-mode">Pick a mode</div>
      <div id="prompt-question">Welcome!</div>
      <div id="capital-clue"></div>
    </div>

    <!-- Feedback -->
    <div class="side-section">
      <div class="side-label">Result</div>
      <div id="feedback-text">—</div>
      <div class="srs-bar">
        <div class="srs-pip" id="pip0"></div>
        <div class="srs-pip" id="pip1"></div>
        <div class="srs-pip" id="pip2"></div>
        <div class="srs-pip" id="pip3"></div>
        <div class="srs-pip" id="pip4"></div>
      </div>
    </div>

    <!-- MC Choices (name mode) -->
    <div class="side-section" id="choices-section" style="display:none;">
      <div class="side-label">Choose</div>
      <div id="choices-box"></div>
    </div>

    <!-- Study search (study mode only) -->
    <div class="side-section" id="search-section" style="display:none;">
      <div class="side-label">Search Countries</div>
      <input id="search-input" type="text" placeholder="Country or capital…" autocomplete="off" spellcheck="false">
      <div id="search-list"></div>
    </div>

    <!-- Tooltip toggles (study mode only) -->
    <div class="side-section" id="label-toggles">
      <div class="side-label">Tooltip Shows</div>
      <div class="toggle-row">
        <span>Country name</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-name" checked>
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>
      <div class="toggle-row">
        <span>Capital city</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-capital">
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>
      <div style="border-top:1px solid var(--border);margin:6px 0 5px;"></div>
      <div class="side-label">Quiz Assist</div>
      <div class="toggle-row">
        <span>Tooltip in quiz</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-assist">
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>
    </div>

    <!-- Mode buttons -->
    <div class="side-section">
      <div class="side-label">Mode</div>
      <button class="mode-btn active" id="mode-click"   onclick="setMode('click')">🗺️ Click the Country</button>
      <button class="mode-btn"        id="mode-name"    onclick="setMode('name')">📝 Name the Country</button>
      <button class="mode-btn"        id="mode-capital" onclick="setMode('capital')">🏛️ Find the Capital</button>
      <button class="mode-btn"        id="mode-study"   onclick="setMode('study')">📖 Study Mode</button>
    </div>

    <!-- Legend -->
    <div class="side-section">
      <div class="side-label">Legend</div>
      <div class="legend-item"><div class="legend-dot" style="background:#2d6a4f"></div>Not visited</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--map-target)"></div>Target</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Correct</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Wrong</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--map-learned)"></div>Learned ✓</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--map-search)"></div>Search result</div>
    </div>

    <!-- Zoom -->
    <div class="side-section">
      <div class="side-label">Zoom</div>
      <div id="zoom-controls">
        <button class="zoom-btn" onclick="zoom(1.4)">＋</button>
        <button class="zoom-btn" onclick="zoom(1/1.4)">－</button>
        <button class="zoom-btn" onclick="resetView()">⌂</button>
      </div>
    </div>

  </div><!-- /side -->

  <div id="map-area">
    <div id="map-scroll">
      <svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>

<div id="tooltip">
  <div class="tt-country" id="tt-country"></div>
  <div class="tt-capital" id="tt-capital" style="display:none;"></div>
</div>
<div id="overlay"><div class="modal" id="modal-content"></div></div>

// Centroid approximation for label placement (bounding-box center of SVG path)
function getPathCenter(d) {
  // Parse all coordinate pairs from the path
  const coords = [];
  const re = /([ML])([0-9.-]+),([0-9.-]+)/g;
  let m;
  while ((m = re.exec(d)) !== null) {
    coords.push([parseFloat(m[2]), parseFloat(m[3])]);
  }
  if (!coords.length) return null;
  // Use bounding-box center
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const [x, y] of coords) {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  return [(minX + maxX) / 2, (minY + maxY) / 2];
}

// Pre-compute centroids
const CENTROIDS = {};
WORLD_COUNTRIES.forEach(c => {
  const ctr = getPathCenter(c.d);
  if (ctr) CENTROIDS[c.id] = ctr;
});

function buildMap() {
  const svg = document.getElementById('map-svg');
  svg.setAttribute('width',   SVG_W);
  svg.setAttribute('height',  SVG_H);
  svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);

  // Sphere
  const sp = document.createElementNS('http://www.w3.org/2000/svg','path');
  sp.setAttribute('class','sphere-path');
  sp.setAttribute('d', SPHERE_PATH);
  svg.appendChild(sp);

  // Graticule
  const gr = document.createElementNS('http://www.w3.org/2000/svg','path');
  gr.setAttribute('class','graticule-path');
  gr.setAttribute('d', GRATICULE_PATH);
  svg.appendChild(gr);

  // Countries
  WORLD_COUNTRIES.forEach(c => {
    const el = document.createElementNS('http://www.w3.org/2000/svg','path');
    el.setAttribute('class','country');
    el.setAttribute('d', c.d);
    el.setAttribute('data-id',   c.id);
    el.setAttribute('data-name', c.name);
    el.addEventListener('mouseenter', onCountryHover);
    el.addEventListener('mouseleave', onCountryLeave);
    el.addEventListener('touchstart', onCountryTouchStart, {passive:true});
    el.addEventListener('touchend',   onCountryTouchEnd,   {passive:true});
    el.addEventListener('click',      onCountryClick);
    svg.appendChild(el);
  });
}

function getCountryEl(id)  { return document.querySelector(`.country[data-id="${id}"]`); }

// ZOOM / PAN
// ─────────────────────────────────────────────
function applyTransform() {
  document.getElementById('map-scroll').style.transform =
    `translate(${panX}px, ${panY}px) scale(${scale})`;
}

function zoom(factor) {
  const area = document.getElementById('map-area');
  const cx = area.clientWidth  / 2;
  const cy = area.clientHeight / 2;
  const ns = Math.min(Math.max(scale * factor, 0.5), 12);
  panX = cx - (cx - panX) * (ns / scale);
  panY = cy - (cy - panY) * (ns / scale);
  scale = ns;
  clampPan();
  applyTransform();
}

function resetView() {
  const area = document.getElementById('map-area');
  scale = Math.min(area.clientWidth / SVG_W, 1.4);
  panX = (area.clientWidth  - SVG_W * scale) / 2;
  panY = (area.clientHeight - SVG_H * scale) / 2;
  clampPan();
  applyTransform();
}

function clampPan() {
  const area = document.getElementById('map-area');
  const mw = SVG_W * scale, mh = SVG_H * scale;
  const minX = Math.min(0, area.clientWidth  - mw);
  const minY = Math.min(0, area.clientHeight - mh);
  panX = Math.max(minX, Math.min(panX, area.clientWidth  > mw ? (area.clientWidth  - mw) / 2 : 0));
  panY = Math.max(minY, Math.min(panY, area.clientHeight > mh ? (area.clientHeight - mh) / 2 : 0));
}

// Pan to a country so it's centered
function panToCountry(id) {
  const ctr = CENTROIDS[id];
  if (!ctr) return;
  const area = document.getElementById('map-area');
  const [cx, cy] = ctr;
  panX = area.clientWidth  / 2 - cx * scale;
  panY = area.clientHeight / 2 - cy * scale;
  clampPan();
  applyTransform();
}

function setupPanZoom() {
  const area = document.getElementById('map-area');

  // ── Mouse ──
  area.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    isPanning = true; didPan = false;
    mouseDownX = e.clientX; mouseDownY = e.clientY;
    startPanX  = e.clientX; startPanY  = e.clientY;
    startOffX  = panX;      startOffY  = panY;
  });
  window.addEventListener('mousemove', e => {
    if (!isPanning) return;
    const dx = e.clientX - startPanX, dy = e.clientY - startPanY;
    if (!didPan && Math.hypot(dx, dy) > DRAG_THRESHOLD) didPan = true;
    if (didPan) {
      panX = startOffX + dx;
      panY = startOffY + dy;
      clampPan();
      applyTransform();
    }
  });
  window.addEventListener('mouseup', () => { isPanning = false; });

  // ── Touch ──
  let lastTouchDist = null;
  area.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      isPanning = true; didPan = false;
      mouseDownX = e.touches[0].clientX; mouseDownY = e.touches[0].clientY;
      startPanX  = e.touches[0].clientX; startPanY  = e.touches[0].clientY;
      startOffX  = panX; startOffY  = panY;
    } else if (e.touches.length === 2) {
      isPanning = false;
      lastTouchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, {passive:true});
  area.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && isPanning) {
      const dx = e.touches[0].clientX - startPanX;
      const dy = e.touches[0].clientY - startPanY;
      if (!didPan && Math.hypot(dx, dy) > DRAG_THRESHOLD) didPan = true;
      if (didPan) {
        panX = startOffX + dx;
        panY = startOffY + dy;
        clampPan();
        applyTransform();
      }
    } else if (e.touches.length === 2 && lastTouchDist !== null) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const factor = dist / lastTouchDist;
      lastTouchDist = dist;
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const ns = Math.min(Math.max(scale * factor, 0.5), 12);
      panX = midX - (midX - panX) * (ns / scale);
      panY = midY - (midY - panY) * (ns / scale);
      scale = ns;
      clampPan();
      applyTransform();
    }
  }, {passive:true});
  area.addEventListener('touchend', () => { isPanning = false; lastTouchDist = null; });

  // ── Wheel zoom ──
  area.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const rect = area.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const ns = Math.min(Math.max(scale * factor, 0.5), 12);
    panX = mx - (mx - panX) * (ns / scale);
    panY = my - (my - panY) * (ns / scale);
    scale = ns;
    clampPan();
    applyTransform();
  }, {passive:false});
}

const tooltip      = document.getElementById('tooltip');
const ttCountryEl  = document.getElementById('tt-country');
const ttCapitalEl  = document.getElementById('tt-capital');
let longPressTimer = null;

function showTooltip(name, x, y) {
  // In quiz modes, only show tooltip if study overlay is also active (study assist)
  // In pure quiz modes with no study assist, suppress tooltip
  if (currentMode !== 'study' && !studyAssist) return;

  const cap = CAPITALS[name] || '';
  const showName = showNames;
  const showCap  = showCapitals && !!cap;

  if (!showName && !showCap) return;

  ttCountryEl.textContent   = showName ? name : '';
  ttCountryEl.style.display = showName ? ''   : 'none';
  ttCapitalEl.textContent   = showCap  ? cap  : '';
  ttCapitalEl.style.display = showCap  ? ''   : 'none';

  tooltip.style.display = 'block';
  placeTooltip(x, y);
}

function hideTooltip() {
  tooltip.style.display = 'none';
  clearTimeout(longPressTimer);
  longPressTimer = null;
}

function placeTooltip(x, y) {
  const tw = tooltip.offsetWidth  || 120;
  const th = tooltip.offsetHeight || 40;
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = x + 14, top = y - 10;
  if (left + tw > vw - 8) left = x - tw - 10;
  if (top  + th > vh - 8) top  = y - th - 6;
  if (top < 4) top = 4;
  tooltip.style.left = left + 'px';
  tooltip.style.top  = top  + 'px';
}

document.addEventListener('mousemove', e => {
  if (tooltip.style.display === 'block') placeTooltip(e.clientX, e.clientY);
});

function onCountryHover(e) {
  if (didPan) return;
  const name = e.target.getAttribute('data-name');
  showTooltip(name, e.clientX, e.clientY);
}

function onCountryLeave() {
  // Don't hide immediately on mouse — only hide if no long-press pending
  hideTooltip();
}

// Long-press for touch devices
function onCountryTouchStart(e) {
  const name = e.target.getAttribute('data-name');
  const t = e.touches[0];
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(() => {
    showTooltip(name, t.clientX, t.clientY);
    // Auto-hide after 2.5s
    setTimeout(hideTooltip, 2500);
  }, 500);
}

function onCountryTouchEnd() {
  clearTimeout(longPressTimer);
  longPressTimer = null;
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-' + mode).classList.add('active');

  // Show/hide study-only panels
  const isStudy = mode === 'study';
  document.getElementById('search-section').style.display  = isStudy ? '' : 'none';
  document.getElementById('label-toggles').style.display   = '';   // always visible
  document.getElementById('choices-section').style.display = 'none';

  clearAll();

  if (mode === 'study') startStudyMode();
  else nextQuestion();
}

function clearAll() {
  clearMapStates();
  setFeedback('—', '');
  document.getElementById('capital-clue').textContent = '';
  answered  = false;
  sessionOver = false;
  searchSelected = null;
}

function clearMapStates() {
  getAllCountryEls().forEach(el => {
    const id = el.getAttribute('data-id');
    el.classList.remove('target','correct','wrong','dimmed','search-hi');
    if (srsData[id] >= 3) el.classList.add('learned');
    else el.classList.remove('learned');
  });
}

// ─────────────────────────────────────────────
// SRS HELPERS
// ─────────────────────────────────────────────
function pickTarget(excludeId) {
  const pool = WORLD_COUNTRIES.filter(c => {
    if (excludeId && c.id === excludeId) return false;
    if (currentMode !== 'study' && srsData[c.id] >= 5) return false;
    return true;
  });
  if (!pool.length) return null;
  const weights = pool.map(c => Math.max(1, 6 - srsData[c.id]));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

function updateSRS(id, correct) {
  srsData[id] = correct
    ? Math.min(5, srsData[id] + 1)
    : Math.max(0, srsData[id] - 1);
}

function updateSRSBar(id) {
  const s = srsData[id];
  for (let i = 0; i < 5; i++)
    document.getElementById('pip' + i).classList.toggle('filled', i < s);
}

// ─────────────────────────────────────────────
// SCORE UI
// ─────────────────────────────────────────────
function updateScoreUI() {
  document.getElementById('sc-correct').textContent = correctCount;
  document.getElementById('sc-wrong').textContent   = wrongCount;
  const learned = WORLD_COUNTRIES.filter(c => srsData[c.id] >= 3).length;
  document.getElementById('sc-learned').textContent = learned;
  document.getElementById('progress-bar').style.width =
    (learned / WORLD_COUNTRIES.length * 100) + '%';
  // Refresh learned highlights
  getAllCountryEls().forEach(el => {
    const id = el.getAttribute('data-id');
    const isActive = el.classList.contains('correct') || el.classList.contains('wrong') ||
                     el.classList.contains('target')  || el.classList.contains('search-hi');
    if (!isActive) {
      if (srsData[id] >= 3) el.classList.add('learned');
      else el.classList.remove('learned');
    }
  });
}

// ─────────────────────────────────────────────
// QUIZ MODES
// ─────────────────────────────────────────────
function nextQuestion() {
  if (sessionOver) return;
  answered = false;
  clearMapStates();
  document.getElementById('choices-section').style.display = 'none';
  document.getElementById('capital-clue').textContent = '';

  const target = pickTarget(currentTarget?.id);
  if (!target) { showCompletionModal(); return; }
  currentTarget = target;

  if (currentMode === 'click') {
    // Show capital as the clue
    const cap = CAPITALS[target.name] || '';
    setPrompt('🗺️ Click the Country', target.name);
    document.getElementById('capital-clue').textContent = cap ? `🏛️ Capital: ${cap}` : '';
    setFeedback('Find it on the map!', '');

  } else if (currentMode === 'name') {
    // Highlight target, choose from 4 names
    const el = getCountryEl(target.id);
    if (el) el.classList.add('target');
    showChoices(target);
    setPrompt('📝 Name this Country', 'What is this country?');

  } else if (currentMode === 'capital') {
    const cap = CAPITALS[target.name];
    if (!cap || cap === '(no capital)') { nextQuestion(); return; }
    setPrompt('🏛️ Find the Capital', `Capital: ${cap}`);
    setFeedback('Click the country!', '');
  }

  updateScoreUI();
}

function showChoices(target) {
  const pool = WORLD_COUNTRIES.filter(c => c.id !== target.id);
  const wrongs = [];
  while (wrongs.length < 3) {
    const r = pool[Math.floor(Math.random() * pool.length)];
    if (!wrongs.find(w => w.id === r.id)) wrongs.push(r);
  }
  const choices = [target, ...wrongs].sort(() => Math.random() - 0.5);
  const box = document.getElementById('choices-box');
  box.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.name;
    btn.addEventListener('click', () => handleChoice(c, target));
    box.appendChild(btn);
  });
  document.getElementById('choices-section').style.display = '';
}

function handleChoice(chosen, target) {
  if (answered) return;
  answered = true;
  const correct = chosen.id === target.id;
  updateSRS(target.id, correct);
  if (correct) correctCount++; else wrongCount++;

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === target.name) b.classList.add('correct');
    else if (b.textContent === chosen.name && !correct) b.classList.add('wrong');
  });

  const el = getCountryEl(target.id);
  if (el) { el.classList.remove('target'); el.classList.add(correct ? 'correct' : 'wrong'); }
  if (!correct) {
    const we = getCountryEl(chosen.id);
    if (we) we.classList.add('wrong');
  }

  setFeedback(
    correct ? `✅ Correct! ${target.name}` : `❌ That's ${chosen.name}`,
    correct ? 'correct' : 'wrong'
  );
  updateScoreUI();
  updateSRSBar(target.id);
  setTimeout(nextQuestion, 1600);
}

function onCountryClick(e) {
  // Ignore if this was a drag
  if (didPan) return;

  if (currentMode === 'study') { handleStudyMapClick(e); return; }
  if (currentMode === 'name')  return; // handled by choice buttons
  if (answered || sessionOver) return;

  const id   = e.target.getAttribute('data-id');
  const name = e.target.getAttribute('data-name');
  if (!currentTarget) return;

  const correct = id === currentTarget.id;
  answered = true;
  updateSRS(currentTarget.id, correct);
  if (correct) correctCount++; else wrongCount++;

  e.target.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    const te = getCountryEl(currentTarget.id);
    if (te) te.classList.add('target');
  }

  setFeedback(
    correct ? `✅ ${currentTarget.name}!` : `❌ That's ${name}. It was ${currentTarget.name}`,
    correct ? 'correct' : 'wrong'
  );
  updateScoreUI();
  updateSRSBar(currentTarget.id);
  setTimeout(nextQuestion, 1800);
}

function startStudyMode() {
  studyOrder = [...WORLD_COUNTRIES].sort(() => Math.random() - 0.5);
  studyIndex = 0;
  searchSelected = null;
  buildSearchList();
  showStudyCountry();
}

function showStudyCountry() {
  clearMapStates();
  searchSelected = null; // clear search highlight when advancing
  updateSearchListSelected();

  if (studyIndex >= studyOrder.length) {
    studyIndex = 0;
    studyOrder = [...studyOrder].sort(() => Math.random() - 0.5);
  }
  currentTarget = studyOrder[studyIndex];

  getAllCountryEls().forEach(el => {
    if (el.getAttribute('data-id') !== currentTarget.id) el.classList.add('dimmed');
  });
  const te = getCountryEl(currentTarget.id);
  if (te) te.classList.add('target');

  const cap = CAPITALS[currentTarget.name] || '—';
  setPrompt('📖 Study Mode', currentTarget.name);
  document.getElementById('capital-clue').textContent = `🏛️ ${cap}`;
  setFeedback('Click map or list to advance', '');
}

// Click on country in study mode → advance
function handleStudyMapClick(e) {
  if (didPan) return;
  studyIndex++;
  showStudyCountry();
}

// ─────────────────────────────────────────────
// SEARCH LIST
// ─────────────────────────────────────────────
function buildSearchList(query) {
  const list = document.getElementById('search-list');
  list.innerHTML = '';
  const q = (query || '').trim().toLowerCase();
  const items = WORLD_COUNTRIES.filter(c => {
    if (!q) return true;
    const cap = (CAPITALS[c.name] || '').toLowerCase();
    return c.name.toLowerCase().includes(q) || cap.includes(q);
  }).sort((a, b) => a.name.localeCompare(b.name));

  items.forEach(c => {
    const cap = CAPITALS[c.name] || '';
    const div = document.createElement('div');
    div.className = 'search-item' + (searchSelected === c.id ? ' selected' : '');
    div.setAttribute('data-id', c.id);
    div.innerHTML = `${c.name}<br><span class="cap">${cap}</span>`;
    div.addEventListener('click', () => selectSearchItem(c.id));
    list.appendChild(div);
  });
}

function selectSearchItem(id) {
  searchSelected = id;
  const country = WORLD_COUNTRIES.find(c => c.id === id);
  if (!country) return;

  // Clear current study dim/target, apply search highlight
  clearMapStates();
  getAllCountryEls().forEach(el => {
    if (el.getAttribute('data-id') !== id) el.classList.add('dimmed');
  });
  const el = getCountryEl(id);
  if (el) { el.classList.remove('learned','dimmed'); el.classList.add('search-hi'); }

  const cap = CAPITALS[country.name] || '—';
  setPrompt('📖 Study Mode', country.name);
  document.getElementById('capital-clue').textContent = `🏛️ ${cap}`;
  setFeedback('Highlighted on map', '');

  updateSearchListSelected();
  panToCountry(id);
}

function updateSearchListSelected() {
  document.querySelectorAll('.search-item').forEach(el => {
    el.classList.toggle('selected', el.getAttribute('data-id') === searchSelected);
  });
}

document.getElementById('search-input').addEventListener('input', function() {
  buildSearchList(this.value);
});

// ─────────────────────────────────────────────
// TOOLTIP TOGGLES
// ─────────────────────────────────────────────
document.getElementById('toggle-name').addEventListener('change', function() {
  showNames = this.checked;
});
document.getElementById('toggle-capital').addEventListener('change', function() {
  showCapitals = this.checked;
});
document.getElementById('toggle-assist').addEventListener('change', function() {
  studyAssist = this.checked;
});

// ─────────────────────────────────────────────
// UI HELPERS
// ─────────────────────────────────────────────
function setPrompt(mode, question) {
  document.getElementById('prompt-mode').textContent = mode;
  const q = document.getElementById('prompt-question');
  q.textContent = question;
  q.className = '';
}

function setFeedback(text, cls) {
  const el = document.getElementById('feedback-text');
  el.textContent = text;
  el.className = cls;
}

// ─────────────────────────────────────────────
// MENU / MODAL
// ─────────────────────────────────────────────
function showMenu() {
  const learned = WORLD_COUNTRIES.filter(c => srsData[c.id] >= 3).length;
  const total   = WORLD_COUNTRIES.length;
  const acc     = correctCount + wrongCount > 0
    ? Math.round(correctCount / (correctCount + wrongCount) * 100) : 0;

  document.getElementById('modal-content').innerHTML = `
    <h2>🌍 World Explorer</h2>
    <p>Free geography quiz by <strong>NeumanGames™</strong><br>Learn all ${total} countries!</p>
    <div style="margin-bottom:14px">
      <div class="modal-stat">${learned}/${total}</div>
      <div class="modal-stat-label">countries learned</div>
      <div class="modal-stat">${acc}%</div>
      <div class="modal-stat-label">accuracy (${correctCount}✅ ${wrongCount}❌)</div>
    </div>
    <div class="modal-grid">
      <button class="modal-btn" onclick="closeMenu();setMode('click')"><span class="icon">🗺️</span>Click the Country</button>
      <button class="modal-btn" onclick="closeMenu();setMode('name')"><span class="icon">📝</span>Name the Country</button>
      <button class="modal-btn" onclick="closeMenu();setMode('capital')"><span class="icon">🏛️</span>Find the Capital</button>
      <button class="modal-btn" onclick="closeMenu();setMode('study')"><span class="icon">📖</span>Study Mode</button>
    </div>
    <button class="modal-btn" onclick="resetAll()" style="width:100%;margin-bottom:8px">🔄 Reset Progress</button>
    <button class="modal-btn" onclick="closeMenu()" style="width:100%">▶ Continue</button>
    <div style="margin-top:14px;font-size:0.74rem;color:var(--muted)">
      Support us:
      <a href="https://ko-fi.com/neumangames" target="_blank" style="color:var(--accent2)">Ko-fi</a> ·
      <a href="https://patreon.com/NeumanGames" target="_blank" style="color:var(--accent2)">Patreon</a>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}

function closeMenu() {
  document.getElementById('overlay').classList.remove('show');
}

function showCompletionModal() {
  sessionOver = true;
  const acc = correctCount + wrongCount > 0
    ? Math.round(correctCount / (correctCount + wrongCount) * 100) : 0;
  document.getElementById('modal-content').innerHTML = `
    <h2>🎉 Amazing!</h2>
    <p>You've mastered all the countries!</p>
    <div class="modal-stat">${acc}%</div>
    <div class="modal-stat-label">accuracy this session</div>
    <div style="height:12px"></div>
    <button class="modal-btn" onclick="resetAll();closeMenu()" style="width:100%;margin-bottom:8px">🔄 Play Again</button>
    <button class="modal-btn" onclick="closeMenu()" style="width:100%">✕ Close</button>
  `;
  document.getElementById('overlay').classList.add('show');
}

function resetAll() {
  WORLD_COUNTRIES.forEach(c => { srsData[c.id] = 0; });
  correctCount = 0; wrongCount = 0;
  updateScoreUI();
  closeMenu();
  setMode(currentMode);
}

document.getElementById('btn-menu').addEventListener('click', showMenu);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeMenu();
});

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
window.addEventListener('load', () => {
  buildMap();
  setupPanZoom();
  resetView();
  nextQuestion();
  updateScoreUI();
});

window.addEventListener('resize', resetView);
</script>
</body>
</html>
